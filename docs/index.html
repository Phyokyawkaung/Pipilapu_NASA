<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earth Analogs Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#05070d;--panel:rgba(11,16,29,.95);--card:#121a2e;--line:#232f4b;--text:#e9eef9;--mute:#93a1bf;--acc:#5ec8ff;--gold:#ffc857;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:6px;padding:10px;flex-wrap:wrap;align-items:center;z-index:5;pointer-events:none}
#bar>*{pointer-events:auto}
#bar button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px}
#bar button.on{border-color:var(--acc);color:var(--acc)}
#bar .sp{flex:1;pointer-events:none}
#pill{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);background:var(--panel)}
#pill.real{border-color:#6ee7a0;color:#6ee7a0}
.lbl{position:fixed;transform:translate(-50%,0);padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;cursor:pointer;z-index:4;white-space:nowrap}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mute);font-size:13px;pointer-events:none;z-index:3}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;z-index:20;display:none;max-width:90vw;white-space:pre-line}
#drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,13,.85);z-index:30;font-size:20px;border:3px dashed var(--acc)}
/* panel */
#panel{position:fixed;z-index:6;background:var(--panel);border:1px solid var(--line);display:none;overflow-y:auto;backdrop-filter:blur(8px);
 left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:72vh;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:860px){#panel{left:auto;right:14px;top:calc(58px + env(safe-area-inset-top,0px));bottom:14px;height:auto;width:min(660px,58vw);border-radius:16px;padding:22px 24px}}
#x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--mute);font-size:26px;line-height:1}
.kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h2{margin:2px 0 2px;font-size:24px;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.mock{margin:12px 0 0;font-size:12px;color:var(--gold);background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.35);border-radius:8px;padding:6px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.chip b{color:var(--acc);font-weight:600}
.chip.on{border-color:var(--acc);background:#14233d}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:14px 0}
.side{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:14px}
.side.an{border-top-color:var(--acc)}
.side h3{margin:2px 0 6px;font-size:16px}
.side p{margin:0 0 6px;font-size:13px;color:var(--mute);line-height:1.45}
.donut{align-self:center;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.donut::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.donut span{position:relative;font-size:22px;font-weight:600}
.donut small{position:absolute;bottom:20px;font-size:9px;color:var(--mute);letter-spacing:.1em}
@media(max-width:859px){.vs{grid-template-columns:1fr 1fr}.donut{grid-column:1/3;order:-1;justify-self:center}}
.why{font-size:13px;line-height:1.5;margin:0 0 6px;padding:10px 12px;border-left:3px solid var(--acc);background:rgba(94,200,255,.06);border-radius:0 8px 8px 0}
.grp{margin:18px 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mr,.mh{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
.mh{border-top:0;font-size:11px;color:var(--mute);padding-bottom:2px}
.mr.one,.mh.one{grid-template-columns:1fr 2fr}
.ml{color:var(--mute);font-size:13px}
.mv small{color:var(--mute);font-size:11px}
.na{color:var(--mute)}
.ms{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.tg{display:inline-block;font-size:11px;padding:2px 7px;margin:0 4px 4px 0;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.tg.sh{border-color:var(--acc);color:var(--acc);background:rgba(94,200,255,.08)}
.src{margin-top:16px;font-size:11px;color:var(--mute);line-height:1.6}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btns button{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:8px 14px;font-size:13px}
.btns button.pri{background:var(--acc);color:#04121f}
.card{display:flex;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:14px}
.card b{color:var(--acc)}
#tools{display:flex;gap:6px;align-items:center;pointer-events:auto}
#q{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--text);width:150px;outline:none}
#q:focus{border-color:var(--acc)}
#res{position:fixed;z-index:25;display:none;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#res button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px;font-size:13px}
#res button:hover{background:#14233d}#res small{color:var(--mute)}
.mlbl{position:fixed;transform:translate(-50%,-150%);font-size:11px;padding:2px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--gold);z-index:4;cursor:pointer;white-space:nowrap;display:none}
.mlbl.an{border-color:var(--acc)}.mlbl.on{background:var(--gold);color:#111}.mlbl.an.on{background:var(--acc)}.mlbl.ef{border-color:#e8e8e8}.mlbl.ef.on{background:#e8e8e8;color:#0b0c0f}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#panel>div,#panel>button.card{animation:pin .35s ease both}
.lbl.dim{opacity:.75;font-size:12px}
.radar{display:flex;flex-direction:column;align-items:center;margin:4px 0 6px}
.radar svg{width:100%;max-width:420px;height:auto}
.radar svg text{fill:var(--mute);font-size:10.5px}
.radar .p{transform-origin:0 0;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scale(.15);opacity:0}to{transform:none;opacity:1}}
.leg{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12px;margin-top:2px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.radar .note{font-size:11px;color:var(--mute);text-align:center;margin-top:6px;max-width:420px;line-height:1.5}
.needs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.need{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
.need.on{border-color:var(--acc);background:#14233d;color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:12px;color:var(--mute)}
.seg button.on{background:#14233d;color:var(--acc)}
.fr{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.fr:hover{border-color:var(--acc)}
.fr .rh{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.fr .rh span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.fr .cov{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.fr .cov i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--acc))}
.fr small{color:var(--mute);font-size:12px}
.fr .ra{font-size:12px;margin-top:8px;color:var(--mute)}.fr .ra b{color:var(--acc);font-weight:600}
#panel.nf>div,#panel.nf>button{animation:none}
.wts{margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 14px}
.wts summary{cursor:pointer;padding:11px 0;font-size:13px}
.cu{color:var(--gold);font-size:11px;margin-left:8px}
.wp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wp button{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--mute)}
.wp button:hover{border-color:var(--acc);color:var(--acc)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.wg label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;color:var(--mute)}
.wg input{grid-column:1/3;width:100%;accent-color:var(--acc)}.wg span{color:var(--text)}
.note2{font-size:11px;color:var(--mute);margin:10px 0 12px;line-height:1.5}
@media(max-width:859px){.wg{grid-template-columns:1fr}}
.alsol{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:12px 0 0}
.chip.auto{border-style:dashed}.chip.alt{opacity:.8}.chip small.uf,.hm small.uf{display:block;font:500 9.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.chip small.uf{display:inline;margin-left:-4px}.hm .alt{opacity:.5}
.top{color:var(--gold);font-style:normal;font-size:11px;margin-left:6px}
.need.scn.on{border-color:var(--gold);color:var(--gold);background:rgba(255,200,87,.1)}
.hmw{overflow-x:auto;margin-top:12px}
.hm{border-collapse:separate;border-spacing:4px;min-width:100%}
.hm th{font-weight:500;color:var(--mute);text-align:left;font-size:11px;vertical-align:bottom;padding:2px 4px}
.hm thead th{text-align:center;min-width:62px;max-width:90px}
.hm tbody th{color:var(--text);font-size:12px;min-width:110px}
.hm th small{display:block;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.hc{position:relative;width:100%;min-width:54px;height:40px;border:0;border-radius:8px;font-size:13px;font-weight:600;color:#fff}
.hc.b{box-shadow:inset 0 0 0 2px var(--acc)}
.hc i{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85}
.hc:hover{filter:brightness(1.3)}
.mockline{margin:8px 0 0;font-size:11px;color:var(--gold);letter-spacing:.04em}
/* loading screen */
#load{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#0b1226,#05070d 70%);transition:opacity .6s ease,visibility .6s}
#load.off{opacity:0;visibility:hidden;pointer-events:none}
#load h1{margin:0 0 4px;font-size:22px;font-weight:600}
#load p{margin:0;color:var(--mute);font-size:13px}
.lo{position:relative;width:104px;height:104px;margin:0 auto 24px}
.lo .e{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fdcff,#2a5d9f 70%);box-shadow:0 0 18px rgba(90,180,255,.45)}
.lo .o{position:absolute;border:1px solid rgba(91,127,184,.28);border-radius:50%;animation:lspin linear infinite}
.lo .o.a{inset:22px;animation-duration:3s}.lo .o.b{inset:0;animation-duration:7s}
.lo .o i{position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#bdbdbd}
.lo .o.b i{top:-5px;width:10px;height:10px;margin-left:-5px;background:#d9663a}
@keyframes lspin{to{transform:rotate(360deg)}}
.lb{width:min(240px,70vw);height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin:18px 0 10px}
.lb i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--gold),var(--acc));transition:width .3s ease}
#lt{max-width:340px;line-height:1.5;min-height:1.5em}
#load.err .lb{display:none}#load.err #lt{color:var(--gold)}
@media(prefers-reduced-motion:reduce){.lo .o{animation:none}#load{transition:none}}
/* methodology panel */
.mp{font-size:13px;line-height:1.55;margin:8px 0}
.mr.m4,.mh.m4{grid-template-columns:2.2fr .8fr .8fr .8fr}
.ml small{display:block;font-size:11px;margin-top:2px}
.lnk{background:none;border:0;padding:0;color:var(--acc);font-size:inherit;text-decoration:underline}
#pill{cursor:pointer}
.efl{height:10px;border-radius:5px;margin:8px 0 4px;border:1px solid var(--line)}
.efs{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.efr{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:8px 2px;font-size:13px;cursor:pointer}
.efr.on{background:rgba(94,200,255,.1)}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:8px 0}
.ck input{margin-top:3px}.ck small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.tg.ok{border-color:#6ee7a0;color:#6ee7a0;background:rgba(110,231,160,.08)}
.tg.pt{border-color:var(--gold);color:var(--gold);background:rgba(255,200,87,.08)}
.tg.no{border-color:#ff8a80;color:#ff8a80;background:rgba(255,138,128,.08)}
.cvr{display:flex;flex-wrap:wrap;align-items:baseline;margin:6px 0}
.cvl{width:112px;flex:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
/* ui refresh: hero action, tabs, category cards */
#panel{--px:18px;--py:18px}@media(min-width:860px){#panel{--px:24px;--py:22px}}
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0 4px;padding:14px 16px;border-radius:14px;border:1px solid rgba(94,200,255,.45);background:linear-gradient(135deg,rgba(94,200,255,.16),rgba(94,200,255,.04) 60%,rgba(255,200,87,.08))}
.hero .ht{display:flex;flex-direction:column;gap:3px;min-width:0}.hero .ht b{font-size:15px}.hero .ht span{font-size:12px;color:var(--mute);line-height:1.4}
.hero .go{flex:none;background:var(--acc);color:#04121f;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;white-space:nowrap;animation:pulse 2.6s ease-out 1s 2}
.hero .go:hover{filter:brightness(1.1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,200,255,.55)}70%,100%{box-shadow:0 0 0 14px rgba(94,200,255,0)}}
@media(max-width:520px){.hero{flex-direction:column;align-items:stretch}.hero .go{width:100%}}
.tabs{position:sticky;top:calc(var(--py)*-1);z-index:3;display:flex;gap:4px;margin:calc(14px - var(--py)) calc(var(--px)*-1) 4px;padding:calc(var(--py) + 8px) var(--px) 8px;background:#0b101d;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:1px solid transparent;border-radius:9px;padding:8px 10px;font-size:13px;color:var(--mute)}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:#14233d;border-color:var(--acc);color:var(--acc);font-weight:600}
.tabhint{font-size:12px;color:var(--mute);margin:10px 0 0;line-height:1.5}
.gc{margin-top:14px;background:rgba(18,26,46,.55);border:1px solid var(--line);border-radius:12px;padding:6px 14px 8px}
.gh{display:flex;gap:10px;align-items:center;padding:8px 0 6px}
.gh .gi{font-size:18px;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#14233d;flex:none}
.gh b{font-size:14px;display:block}.gh small{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.gc .mh{padding-top:2px}
.efback{margin:2px 0 0;font-size:13px}
/* ===== UI overhaul (Nov 2026): flat "instrument panel" look. One accent per meaning:
   --gold = Moon/Mars target, --acc = Earth analog. No gradients, glows or emoji.
   This block overrides the rules above; edit the look here. ===== */
:root{--bg:#07080b;--panel:rgba(14,16,20,.97);--solid:#0e1014;--card:#14171d;--line:#272b34;--text:#e7e5df;--mute:#8d929c;--acc:#7cc7ee;--gold:#e3b04b;--ok:#7fcf9a;--bad:#ef8f7f;
 --sel:rgba(124,199,238,.1);--r:6px;--r-s:4px;--mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,"Liberation Mono",monospace}
html,body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* top bar */
#bar{gap:0 2px;padding:0 14px;min-height:48px;background:var(--panel);border-bottom:1px solid var(--line);pointer-events:auto}
#bar::before{content:"Earth Analogs";font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text);margin-right:18px;padding-right:18px;border-right:1px solid var(--line);align-self:center;line-height:20px}
#bar button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:0 12px;height:48px;font-size:13px;color:var(--mute)}
#bar button:hover{color:var(--text)}
#bar button.on{border-color:var(--text);color:var(--text)}
#tools{gap:2px;margin-left:8px}
#q{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;width:170px;margin-right:6px}
#q::placeholder{color:var(--mute)}
#pill{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:var(--r-s);background:none;margin-left:8px}
#pill.real{border-color:var(--ok);color:var(--ok)}
#res{border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.5)}
#res button:hover{background:var(--sel)}
@media(max-width:859px){#bar::before{display:none}#bar{padding:0 6px}#bar button{height:40px;padding:0 9px}#q{width:120px}}
/* labels on the 3D view */
.lbl{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:2px;background:rgba(14,16,20,.82)}
.lbl:hover{border-color:var(--text)}
.lbl.dim{font-size:10px}
.mlbl{font:500 10.5px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border-radius:2px;background:rgba(14,16,20,.9)}
.mlbl.on{color:#0b0c0f}
#hint{font-size:12px;letter-spacing:.02em}
#toast{border-radius:var(--r);top:62px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
#drop{background:rgba(7,8,11,.9);font-size:16px;border:1px dashed var(--acc)}
/* panel: docked sheet */
#panel{backdrop-filter:none;border-radius:12px 12px 0 0;border-width:1px 0 0}
@media(min-width:860px){#panel{right:0;top:calc(49px + env(safe-area-inset-top,0px));bottom:0;width:min(760px,52vw);border-radius:0;border-width:0 0 0 1px}}
#x{top:14px;right:16px;font-size:22px;width:32px;height:32px;border-radius:var(--r-s)}
#x:hover{background:var(--card);color:var(--text)}
.kick,.grp,.alsol,.cvl{font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.grp{margin:22px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:4px 0 2px}
.sub{font-size:13px;line-height:1.45}
.mockline{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}

  const poly=s=>ms.map((m,i)=>f1(pt(i,.04+.96*nz(m,val(s,m.key))))).join(' ');

async function mBestOpen(tid,i){await efStart(tid);if(EF.picks.some(p=>p.i===i))efSel(i)}
/* ---------- Find on Earth ----------
   Scores every cell of the Earth grid (docs/data, made by pipeline/) against a Moon/Mars target and paints it on the globe.
   Same similarity rule as the rest of the app: 1 - min(1, |gap| / scale). Each dimension counts equally and its features share
   that weight; a cell missing a feature is scored on the rest. Target values come from data/targets.json. */
var EF={grid:null,feats:{},targets:null,tid:null,on:{},score:null,sel:-1,picks:[],best:null,hideKnown:false,keep:false,mesh:null,cv:null,tex:null};
const EF_RAMP=[[0,[40,12,90]],[.4,[190,50,90]],[.7,[250,150,40]],[1,[255,245,150]]];
function efRamp(s){for(let i=1;i<EF_RAMP.length;i++){const[a,c]=EF_RAMP[i-1],[b,d]=EF_RAMP[i];if(s<=b){const u=(s-a)/(b-a);return c.map((x,k)=>x+(d[k]-x)*u)}}return EF_RAMP[EF_RAMP.length-1][1]}
function efHide(){if(EF&&EF.mesh)EF.mesh.visible=false;if(EF&&EF.pg)EF.pg.visible=false}
/* Numbered pins for the best distinct places; the selected one is larger, pings, and its label shows the score. */
function efPins(){const v=VIS.earth,R=v.R;if(!EF.pg){EF.pg=new THREE.Group();v.mesh.add(EF.pg)}
  while(EF.pg.children.length)EF.pg.remove(EF.pg.children[0]);(EF.pinEls||[]).forEach(q=>q.el.remove());EF.pinEls=[];
  EF.picks.forEach((p,k)=>{const on=p.i===EF.sel,g=mkPin(R,ll(p.la,p.lo,1).normalize(),0xffffff,on);if(!on)g.userData.ping.visible=false;EF.pg.add(g);
    const el=document.createElement('div');el.className='mlbl ef'+(on?' on':'');el.textContent=on?`${k+1} · ${pct(p.s)}`:String(k+1);el.title=efLL(p.la,p.lo);el.onclick=()=>efSel(p.i);document.body.appendChild(el);
    EF.pinEls.push({g,el,on})});
  EF.pg.visible=true}
async function efLoad(){
  if(EF.grid)return;
  const get=async u=>{const r=await fetch(u,{cache:'no-cache'});/* always ask the server: data files change on every pipeline run */if(!r.ok)throw new Error(u+' returned HTTP '+r.status);return r},feats={};
  const g=await (await get('data/grid.json')).json();
  for(const f of g.features){const b=await (await get('data/'+f.key+'.bin')).arrayBuffer();if(b.byteLength!==g.ny*g.nx*4)throw new Error(f.key+'.bin does not match the size in grid.json');feats[f.key]=new Float32Array(b)}
  let t=null;try{t=await (await get('data/targets.json')).json()}catch(e){}
  EF.grid=g;EF.feats=feats;EF.targets=t}
function efScore(){
  const g=EF.grid,T=EF.targets.targets[EF.tid]||{},n=g.ny*g.nx,use=g.features.filter(f=>EF.on[f.dimension]&&T[f.key]),per={};
  use.forEach(f=>per[f.dimension]=(per[f.dimension]||0)+1);
  const num=new Float32Array(n),den=new Float32Array(n),sc=new Float32Array(n).fill(NaN);
  for(const f of use){const a=EF.feats[f.key],t=T[f.key].value,s=f.scale||1,w=1/per[f.dimension];
    for(let i=0;i<n;i++){const v=a[i];if(v===v){num[i]+=w*(1-Math.min(1,Math.abs(v-t)/s));den[i]+=w}}}

const efKm=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const efCell=i=>{const g=EF.grid;return[90-(Math.floor(i/g.nx)+.5)*g.cell_deg,-180+(i%g.nx+.5)*g.cell_deg]};
const efLL=(la,lo)=>Math.abs(la).toFixed(1)+'°'+(la>=0?'N':'S')+', '+Math.abs(lo).toFixed(1)+'°'+(lo>=0?'E':'W');
function efPick(){
  const sc=EF.score,idx=[];for(let i=0;i<sc.length;i++)if(sc[i]===sc[i])idx.push(i);
  idx.sort((a,b)=>sc[b]-sc[a]);
  const known=DATA.sites.filter(s=>s.body==='earth'),near=(la,lo)=>{let b=null,d=1e9;known.forEach(s=>{const k=efKm(la,lo,s.lat,s.lon);if(k<d){d=k;b=s}});return d<=500?b:null},out=[];

    if(out.every(p=>efKm(la,lo,p.la,p.lo)>800)){out.push({i,la,lo,s:sc[i],k});if(out.length===10)break}}

function efPaint(){
  const g=EF.grid;if(!EF.cv){EF.cv=document.createElement('canvas');EF.cv.width=g.nx;EF.cv.height=g.ny}

    const v=VIS.earth;EF.mesh=new THREE.Mesh(new THREE.SphereGeometry(v.R*1.006,96,64),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));v.mesh.add(EF.mesh)}

function efFly(la,lo){const v=VIS.earth,c=v.mesh.position.clone(),dir=v.mesh.localToWorld(ll(la,lo,v.R)).sub(c).normalize();flyTo(c.clone().add(dir.multiplyScalar(v.R*2.7)),c,v.R*1.2)}
function efMsg(title,html){EF.keep=true;openPanel(`<div class="kick">Find on Earth</div><h2>${title}</h2>${html}<div class="btns"><button class="pri" onclick="showSite('${EF.tid}')">Back to ${esc(S[EF.tid].name)}</button></div>`);EF.keep=false}
async function efStart(tid){

    <div class="mp">1. Open the site through a local server (README, section 1), not by double-clicking the file.</div>
    <div class="mp">2. Make the files: <b>python pipeline/make_demo_grid.py</b> (fake data) or <b>python pipeline/build_grid.py</b> (real data).</div><div class="note2">Details: ${esc(e.message)}</div>`)}

function efUpdate(){efScore();efPick();if(!EF.picks.some(p=>p.i===EF.sel))EF.sel=EF.picks.length?EF.picks[0].i:-1;efPaint();efPins();efDraw()}

const pv=new THREE.Vector3();
